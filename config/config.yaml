# ============================================================
# 项目全局配置
# ============================================================

# 接口基础地址
base:
  url: http://127.0.0.1:5000

# 运行环境标识（test / dev / prod）
env: test

# HTTP 请求超时时间（秒）
timeout: 10

# 全局默认请求头
headers:
  Content-Type: application/json

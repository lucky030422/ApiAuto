login_success:
  priority: 1
  title: 登录成功

  request:
    method: POST
    url: /login

    json:
      username: admin
      password: 123456

    need_token: false
  extract:
    token:
      jsonpath: $.data.token

  validate:
    status_code: 200
    code: 200


login_password_error:
  title: 密码错误

  request:
    method: POST
    url: login

    json:
      username: admin
      password: 12345

    need_token: false

  validate:
    status_code: 200
    code: 200
login_user_error:
  title: 用户不存在


  request:
    method: POST
    url: login

    json:
      username: admin1
      password: 12345

    need_token: false

  validate:
    status_code: 200
    code: 200
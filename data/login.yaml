# ============================================================
# 登录模块测试数据
# 每条用例为 YAML 顶层 key，包含:
#   - title:    用例标题（显示在 Allure 报告）
#   - request:  请求参数（method/url/json/need_token 等）
#   - extract:  变量提取规则（可选）
#   - validate: 断言规则（status_code / code / msg）
#   - priority: 执行优先级（值越小越先执行）
# ============================================================

# 用例1：登录成功
login_success:
  priority: 1
  title: 登录成功

  request:
    method: POST
    url: /login
    json:
      username: admin
      password: 123456
    need_token: false           # 登录接口不需要 token

  extract:
    token:                      # 提取 token 存入全局变量
      jsonpath: $.data.token

  validate:
    status_code: 200
    code: 200

# 用例2：密码错误
login_password_error:
  title: 密码错误

  request:
    method: POST
    url: login
    json:
      username: admin
      password: 12345           # 错误密码
    need_token: false

  validate:
    status_code: 200
    code: 200

# 用例3：用户不存在
login_user_error:
  title: 用户不存在

  request:
    method: POST
    url: login
    json:
      username: admin1          # 不存在的用户名
      password: 12345
    need_token: false

  validate:
    status_code: 200
    code: 200
